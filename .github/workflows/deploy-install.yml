name: Deploy install.sh

# Keeps the website copy of install.sh (the `curl … | bash` target served at
# https://navindbhudiya.com/install.sh) in sync with the repo. Fires whenever install.sh
# changes on main, so you never have to remember to re-upload it. Run it by hand too.
#
# One-time setup — repo → Settings → Secrets and variables → Actions:
#   Secrets:
#     AWS_ACCESS_KEY_ID       an IAM key allowed to write to the bucket
#     AWS_SECRET_ACCESS_KEY
#   Variables:
#     AWS_REGION              e.g. us-east-1
#     S3_BUCKET               your site bucket (same one website/deploy.sh uses)
#     CLOUDFRONT_DISTRIBUTION_ID   optional — set only if the site is behind CloudFront

on:
  push:
    branches: [main]
    paths: ["install.sh"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload install.sh (no-cache, inline-viewable)
        env:
          BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          aws s3 cp install.sh "s3://${BUCKET}/install.sh" \
            --cache-control "no-cache" \
            --content-type "text/plain; charset=utf-8"

      - name: Invalidate CloudFront (if configured)
        if: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        env:
          DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${DISTRIBUTION_ID}" \
            --paths "/install.sh"
